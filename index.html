<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROI-360 Automação - Dashboard</title>
    
    <!-- Meta tags for PWA -->
    <meta name="description" content="Sistema de automação avançado com inteligência artificial para otimização de vendas e processos">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ROI-360 Automação">
    
    <!-- Favicon and PWA icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7V17L12 22L22 17V7L12 2Z'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7V17L12 22L22 17V7L12 2Z'/></svg>">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Preload critical resources -->
    <link rel="modulepreload" href="firebase-config.js">
    <link rel="modulepreload" href="auth.js">
    <link rel="modulepreload" href="automation.js">
    <link rel="modulepreload" href="dashboard.js">
    <link rel="modulepreload" href="utils.js">
</head>
<body class="antialiased">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="spinner mb-4" style="width: 2rem; height: 2rem; border-width: 3px;"></div>
            <h2 class="text-xl font-semibold text-white mb-2">ROI-360 Automação</h2>
            <p class="text-gray-400">Inicializando sistema...</p>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div id="dashboard" class="hidden">
        <!-- Dashboard content will be rendered here by dashboard.js -->
    </div>

    <!-- Auth Modal Container -->
    <!-- Auth modal will be dynamically created by auth.js -->

    <!-- Notification Container -->
    <!-- Notifications will be dynamically created by utils.js -->

    <!-- Error Boundary -->
    <div id="error-boundary" class="hidden fixed inset-0 bg-red-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-lg max-w-md w-full mx-4">
            <div class="text-center">
                <div class="text-red-500 text-4xl mb-4">⚠️</div>
                <h3 class="text-xl font-bold text-white mb-2">Erro do Sistema</h3>
                <p id="error-message" class="text-gray-300 mb-6">Ocorreu um erro inesperado.</p>
                <button id="reload-btn" class="btn btn-primary">Recarregar Página</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        // Global error handler
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showErrorBoundary(event.error.message);
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            showErrorBoundary(event.reason.message || 'Promise rejection');
        });

        function showErrorBoundary(message) {
            const errorBoundary = document.getElementById('error-boundary');
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = message;
            errorBoundary.classList.remove('hidden');
        }

        document.getElementById('reload-btn').addEventListener('click', () => {
            window.location.reload();
        });

        // Main application initialization
        async function initializeApp() {
            try {
                // Import modules
                const { authManager } = await import('./auth.js');
                const { automationManager } = await import('./automation.js');
                const { dashboardManager } = await import('./dashboard.js');
                
                // Initialize authentication first
                console.log('Initializing authentication...');
                authManager.onAuthStateChange(async (user) => {
                    if (user) {
                        console.log('User authenticated, initializing automation system...');
                        
                        // Initialize automation system
                        await automationManager.initialize();
                        
                        // Initialize dashboard
                        await dashboardManager.initialize();
                        
                        // Hide loading screen
                        hideLoadingScreen();
                    } else {
                        console.log('User not authenticated');
                        hideLoadingScreen();
                    }
                });

                console.log('Application initialized successfully');
                
            } catch (error) {
                console.error('Failed to initialize application:', error);
                showErrorBoundary(error.message);
            }
        }

        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 300);
        }

        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Initialize the application
        initializeApp();
    </script>
</body>
</html>
</body>
</html>
