    <!-- Error Boundary -->
    <div id="error-boundary" class="hidden fixed inset-0 bg-red-900 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-lg max-w-md w-full mx-4">

                <h3 class="text-xl font-bold text-white mb-2">Erro do Sistema</h3>
                <p id="error-message" class="text-gray-300 mb-6">Ocorreu um erro inesperado.</p>
                <button id="reload-btn" class="btn btn-primary">Recarregar Página</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        // Global error handler
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showErrorBoundary(event.error.message);
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            showErrorBoundary(event.reason.message || 'Promise rejection');
        });

        function showErrorBoundary(message) {
            const errorBoundary = document.getElementById('error-boundary');
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = message;
            errorBoundary.classList.remove('hidden');
        }

        document.getElementById('reload-btn').addEventListener('click', () => {
            window.location.reload();
        });

        // Main application initialization
        async function initializeApp() {
            try {
                console.log('Starting application initialization...');
                
                // First try to initialize without modules for demo mode
                if (typeof window !== 'undefined') {
                    // Create basic dashboard structure
                    createBasicDashboard();
                    hideLoadingScreen();
                    return;
                }
                
                // Try to import modules
                console.log('Importing modules...');
                const { authManager } = await import('./auth.js').catch(() => ({ authManager: null }));
                
                if (authManager) {
                    console.log('Initializing authentication...');
                    const authSuccess = await authManager.initialize();
                    
                    if (authSuccess) {
                        authManager.onAuthStateChange(async (user) => {
                            if (user) {
                                console.log('User authenticated, loading modules...');
                                
                                try {
                                    const { automationManager } = await import('./automation.js');
                                    const { dashboardManager } = await import('./dashboard.js');
                                    
                                    await automationManager.initialize();
                                    await dashboardManager.initialize();
                                } catch (error) {
                                    console.warn('Failed to load advanced modules, using basic dashboard:', error);
                                    createBasicDashboard();
                                }
                                
                                hideLoadingScreen();
                            } else {
                                console.log('User not authenticated');
                                hideLoadingScreen();
                            }
                        });
                    } else {
                        // Auth manager failed, show basic dashboard
                        createBasicDashboard();
                        hideLoadingScreen();
                    }
                } else {
                    // No auth manager, show basic dashboard
                    createBasicDashboard();
                    hideLoadingScreen();
                }

                console.log('Application initialized successfully');
                
            } catch (error) {
                console.error('Failed to initialize application:', error);
                createBasicDashboard();
                hideLoadingScreen();
            }
        }

            // Update content

                    break;
                case 'automations':

                    break;
                case 'executions':
                    content.innerHTML = getExecutionsContent();
                    break;

                    break;
